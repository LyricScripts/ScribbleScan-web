<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B57">
<title>ScribbleScan</title>
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<div id="app" class="shell" hidden>
  <nav class="rail" aria-label="Main">
    <a class="brand" href="#/home">ScribbleScan</a>
    <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg><span>Spending</span></a>
    <a href="#/receipts" data-tab="receipts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6m-6 4h6"/></svg><span>Receipts</span></a>
    <a href="#/add" data-tab="add" class="add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add</span></a>
    <a href="#/budgets" data-tab="budgets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/></svg><span>Budgets</span></a>
  </nav>
  <div class="main">
    <header class="top">
      <label class="space-pick">
        <span class="sr">Space</span>
        <select id="space"></select>
      </label>
      <button class="ghost" id="signout" type="button">Sign out</button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="signin" class="signin" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
