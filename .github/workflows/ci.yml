name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Image builds and serves both pages
        run: |
          podman build -t scribblescan-web:ci .
          podman run -d --name web -p 3000:3000 scribblescan-web:ci
          for i in $(seq 20); do curl -fsS http://127.0.0.1:3000/ -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ | grep -q '<title>ScribbleScan — Spending</title>'
          curl -fsS http://127.0.0.1:3000/scan | grep -q 'ScribbleScan camera'
      - name: Every page signs its scripts with the nonce in the request
        run: |
          # Caddy sends a Content-Security-Policy with a nonce; Next.js reads it
          # and signs the scripts it returns. A page served from the build cache
          # would come back unsigned and the browser would refuse to run it, so
          # every page has to be checked.
          for page in / /scan /receipts /budgets /spaces /connect; do
            body=$(curl -fsS -H "Content-Security-Policy: script-src 'self' 'nonce-testnonce'" "http://127.0.0.1:3000$page")
            total=$(grep -o '<script[^>]*>' <<<"$body" | wc -l)
            signed=$(grep -o '<script[^>]*nonce="testnonce"[^>]*>' <<<"$body" | wc -l)
            test "$total" -gt 0
            test "$total" -eq "$signed" || { echo "$page: $signed of $total scripts signed"; exit 1; }
          done
