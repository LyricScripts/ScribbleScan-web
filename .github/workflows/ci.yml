name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Image builds and serves both pages
        run: |
          podman build -t scribblescan-web:ci .
          printf ':8080 {\n\troot * /srv/web\n\ttry_files {path} {path}.html /index.html\n\tfile_server\n}\n' > Caddyfile.ci
          podman run -d --name web -p 8080:8080 -v "$PWD/Caddyfile.ci:/etc/caddy/Caddyfile:ro" scribblescan-web:ci
          for i in $(seq 20); do curl -fsS http://127.0.0.1:8080/ -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>ScribbleScan</title>'
          curl -fsS http://127.0.0.1:8080/scan | grep -q 'ScribbleScan camera'
