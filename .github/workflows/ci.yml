name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Image serves pages with request CSP nonce
        run: |
          podman build -t scribblescan-web:ci .
          podman run -d --name web -p 3000:3000 -e HOSTNAME=0.0.0.0 scribblescan-web:ci
          trap 'podman rm -f web >/dev/null 2>&1 || true' EXIT
          for i in $(seq 30); do curl -fsS http://127.0.0.1:3000/ -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ | grep -q '<title>ScribbleScan — Spending</title>'
          curl -fsS http://127.0.0.1:3000/scan | grep -q 'ScribbleScan camera'
          for path in / /scan /receipts /reconciliation /budgets /spaces /connect; do
            curl -fsS -H "Content-Security-Policy: script-src 'self' 'nonce-ci-proof'" \
              "http://127.0.0.1:3000$path" | node -e '
                let html = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => html += chunk);
                process.stdin.on("end", () => {
                  const scripts = [...html.matchAll(/<script\b[^>]*>/g)].map(match => match[0]);
                  if (!scripts.length || scripts.some(tag => !/\bnonce="ci-proof"/.test(tag))) {
                    console.error("Missing CSP nonce on a script");
                    process.exit(1);
                  }
                });
              '
          done
